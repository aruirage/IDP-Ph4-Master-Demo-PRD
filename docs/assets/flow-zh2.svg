<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">案件处理期流程</title>
  <desc id="desc">按接口字段字典 1.2 案件处理期流程，覆盖批次、补件、重新识别、异步轮询、结果分页、staging 校验和结果应用</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#175cd3"/></marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#667085"/></marker>
  </defs>
  <rect width="1120" height="520" fill="#fff"/>
  <g font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#172033">
    <rect x="30" y="18" width="230" height="44" rx="7" fill="#f7f9fc" stroke="#d8dee8"/>
    <rect x="300" y="18" width="290" height="44" rx="7" fill="#f7f9fc" stroke="#d8dee8"/>
    <rect x="620" y="18" width="210" height="44" rx="7" fill="#f7f9fc" stroke="#d8dee8"/>
    <rect x="870" y="18" width="220" height="44" rx="7" fill="#f7f9fc" stroke="#d8dee8"/>
    <g font-size="14" font-weight="700" text-anchor="middle"><text x="145" y="45">案件 / 批次</text><text x="445" y="45">IDP 案件服务</text><text x="725" y="45">主数据照合 API</text><text x="980" y="45">OCR抽出确认</text></g>
    <g stroke="#cfd7e3" stroke-width="1.2" stroke-dasharray="4 5"><line x1="145" y1="62" x2="145" y2="458"/><line x1="445" y1="62" x2="445" y2="458"/><line x1="725" y1="62" x2="725" y2="458"/><line x1="980" y1="62" x2="980" y2="458"/></g>

    <rect x="30" y="78" width="230" height="70" rx="8" fill="#eef4ff" stroke="#9db9ec"/>
    <text x="44" y="98" font-size="12.3" font-weight="700">① 确定批次处理方式</text>
    <text x="44" y="116" font-size="9.6" fill="#475467">新文件／补件：新建独立批次</text>
    <text x="44" y="131" font-size="9.6" fill="#475467">重新识别：新版本请求后取消旧任务</text>
    <line x1="262" y1="113" x2="415" y2="113" stroke="#175cd3" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="300" y="156" width="290" height="58" rx="8" fill="#f7faff" stroke="#9db9ec"/>
    <text x="445" y="176" text-anchor="middle" font-size="12" font-weight="700">② OCR完成，冻结批次快照</text>
    <text x="445" y="194" text-anchor="middle" font-size="9.7" fill="#475467">全部账票 + caseResult + 有效组 + groupsVersion</text>
    <line x1="445" y1="154" x2="445" y2="130" stroke="#175cd3" stroke-width="1.6" marker-end="url(#arrow)"/>

    <line x1="590" y1="187" x2="708" y2="187" stroke="#175cd3" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="725" y="175" text-anchor="middle" font-size="10.4" font-weight="700" fill="#175cd3">③ POST /v1/standardizations</text>
    <text x="725" y="194" text-anchor="middle" font-size="9.2" fill="#667085">>50 份：同 caseNo 拆分，递增序号</text>

    <line x1="708" y1="226" x2="593" y2="226" stroke="#667085" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrowGray)"/>
    <text x="650" y="220" text-anchor="middle" font-size="9.5" font-weight="700">SUCCEEDED／FAILED／CANCELLED</text>
    <text x="650" y="238" text-anchor="middle" font-size="9.3" fill="#667085">或 PENDING／PROCESSING + taskId</text>

    <rect x="30" y="258" width="230" height="48" rx="8" fill="#edf9f2" stroke="#9fd3b8"/>
    <text x="145" y="277" text-anchor="middle" font-size="10.7" font-weight="700" fill="#087a4b">立即结束</text><text x="145" y="294" text-anchor="middle" font-size="9.3" fill="#087a4b">直接进入结果校验</text>
    <line x1="300" y1="282" x2="263" y2="282" stroke="#087a4b" stroke-width="1.3" marker-end="url(#arrowGray)"/>

    <rect x="300" y="258" width="290" height="70" rx="8" fill="#f7faff" stroke="#9db9ec"/>
    <text x="445" y="277" text-anchor="middle" font-size="11.5" font-weight="700">④ 异步等待：保存轮询状态</text>
    <text x="445" y="294" text-anchor="middle" font-size="9.4" fill="#475467">batchId / taskId 列表 / clientRequestId / pollAfterMs</text>
    <text x="445" y="310" text-anchor="middle" font-size="9.4" fill="#475467">每 5～10 秒查询已完成任务</text>

    <line x1="445" y1="352" x2="708" y2="352" stroke="#175cd3" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="585" y="344" text-anchor="middle" font-size="10.2" font-weight="700" fill="#175cd3">GET /v1/standardizations</text>
    <text x="585" y="361" text-anchor="middle" font-size="9.2" fill="#667085">首次 finishedAfter，后续 cursor</text>
    <line x1="708" y1="382" x2="593" y2="382" stroke="#667085" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrowGray)"/>
    <text x="650" y="376" text-anchor="middle" font-size="9.4" fill="#475467">已完成任务 + nextCursor</text>

    <rect x="300" y="400" width="290" height="58" rx="8" fill="#fff8e7" stroke="#efd7a3"/>
    <text x="445" y="419" text-anchor="middle" font-size="11.3" font-weight="700" fill="#8f5700">⑤ 读取任务与分页结果</text>
    <text x="445" y="436" text-anchor="middle" font-size="9.3" fill="#8f5700">GET /{taskId} → itemsNextCursor → GET /items</text>
    <text x="445" y="451" text-anchor="middle" font-size="9.2" fill="#8f5700">task / documents / items / caseReview</text>

    <rect x="680" y="400" width="390" height="58" rx="8" fill="#edf9f2" stroke="#9fd3b8"/>
    <text x="875" y="419" text-anchor="middle" font-size="11.2" font-weight="700" fill="#087a4b">⑥ staging 校验后应用结果</text>
    <text x="875" y="436" text-anchor="middle" font-size="9.3" fill="#087a4b">needsReview=false：按 targets 回填并保存 selection</text>
    <text x="875" y="451" text-anchor="middle" font-size="9.3" fill="#087a4b">needsReview=true：进入本批次 OCR抽出确认</text>
    <line x1="590" y1="429" x2="677" y2="429" stroke="#087a4b" stroke-width="1.3" marker-end="url(#arrowGray)"/>

    <rect x="30" y="474" width="1060" height="32" rx="7" fill="#fff8e7" stroke="#efd7a3"/>
    <text x="560" y="496" text-anchor="middle" font-size="10.2" font-weight="700" fill="#5e3b07">新文件／补件：旧批次继续　•　重新识别：新版本请求并取消旧任务　•　同批次多 taskId 合并结果　•　P1：callbackUrl／feedback</text>
  </g>
</svg>

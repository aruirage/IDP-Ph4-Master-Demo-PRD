<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">配置期流程</title>
  <desc id="desc">按接口字段字典 1.1 配置期流程，获取 masters、catalog、defaults，配置组和回填目标，validate 后保存 groupsVersion</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#175cd3"/></marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#667085"/></marker>
  </defs>
  <rect width="1120" height="520" fill="#fff"/>
  <g font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#172033">
    <rect x="30" y="18" width="240" height="44" rx="7" fill="#f7f9fc" stroke="#d8dee8"/>
    <rect x="405" y="18" width="310" height="44" rx="7" fill="#f7f9fc" stroke="#d8dee8"/>
    <rect x="845" y="18" width="245" height="44" rx="7" fill="#f7f9fc" stroke="#d8dee8"/>
    <g font-size="14" font-weight="700" text-anchor="middle"><text x="150" y="45">配置管理员</text><text x="560" y="45">IDP 设置服务</text><text x="967" y="45">主数据照合 API</text></g>
    <g stroke="#cfd7e3" stroke-width="1.2" stroke-dasharray="4 5"><line x1="150" y1="62" x2="150" y2="458"/><line x1="560" y1="62" x2="560" y2="458"/><line x1="967" y1="62" x2="967" y2="458"/></g>

    <rect x="30" y="78" width="240" height="48" rx="8" fill="#eef4ff" stroke="#9db9ec"/>
    <text x="44" y="98" font-size="12.5" font-weight="700">① 打开照合组设置</text><text x="44" y="115" font-size="10" fill="#667085">选择适用场景并创建或编辑组</text>
    <line x1="272" y1="102" x2="535" y2="102" stroke="#175cd3" stroke-width="1.6" marker-end="url(#arrow)"/>

    <line x1="560" y1="145" x2="912" y2="145" stroke="#175cd3" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="736" y="137" text-anchor="middle" font-size="10.5" font-weight="700" fill="#175cd3">② GET /v1/masters</text>
    <line x1="967" y1="174" x2="565" y2="174" stroke="#667085" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrowGray)"/>
    <text x="766" y="169" text-anchor="middle" font-size="9.8" fill="#475467">主数据表 / 列 / hint / schemaVersion</text>

    <line x1="560" y1="214" x2="912" y2="214" stroke="#175cd3" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="736" y="206" text-anchor="middle" font-size="10.5" font-weight="700" fill="#175cd3">③ GET /v1/catalog</text>
    <line x1="967" y1="243" x2="565" y2="243" stroke="#667085" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrowGray)"/>
    <text x="766" y="238" text-anchor="middle" font-size="9.8" fill="#475467">枚举值与显示名称</text>

    <line x1="560" y1="283" x2="912" y2="283" stroke="#175cd3" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="736" y="275" text-anchor="middle" font-size="10.5" font-weight="700" fill="#175cd3">④ GET /v1/groups/defaults</text>
    <line x1="967" y1="312" x2="565" y2="312" stroke="#667085" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrowGray)"/>
    <text x="766" y="307" text-anchor="middle" font-size="9.8" fill="#475467">默认组模板（可导入）</text>

    <rect x="405" y="332" width="310" height="54" rx="8" fill="#f7faff" stroke="#9db9ec"/>
    <text x="560" y="351" text-anchor="middle" font-size="12" font-weight="700">⑤ 配置组、字段与回填目标</text>
    <text x="560" y="368" text-anchor="middle" font-size="9.8" fill="#475467">主输入 / 辅助输入 / mode / OUTPUT 目标 / 帳票类型</text>
    <line x1="272" y1="359" x2="402" y2="359" stroke="#175cd3" stroke-width="1.6" marker-end="url(#arrow)"/>

    <line x1="560" y1="407" x2="912" y2="407" stroke="#175cd3" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="736" y="399" text-anchor="middle" font-size="10.5" font-weight="700" fill="#175cd3">⑥ POST /v1/groups/validate</text>
    <line x1="967" y1="437" x2="565" y2="437" stroke="#667085" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrowGray)"/>
    <text x="766" y="432" text-anchor="middle" font-size="9.8" fill="#475467">errors / instances / targets / valid</text>

    <rect x="30" y="452" width="300" height="52" rx="8" fill="#fff8e7" stroke="#efd7a3"/>
    <text x="180" y="471" text-anchor="middle" font-size="11" font-weight="700" fill="#8f5700">有 errors：按项目显示，保持未校验</text>
    <text x="180" y="489" text-anchor="middle" font-size="9.5" fill="#8f5700">管理员修正后重新调用 validate</text>
    <line x1="560" y1="478" x2="332" y2="478" stroke="#8f5700" stroke-width="1.3" marker-end="url(#arrowGray)"/>

    <rect x="600" y="452" width="500" height="52" rx="8" fill="#edf9f2" stroke="#9fd3b8"/>
    <text x="850" y="471" text-anchor="middle" font-size="11" font-weight="700" fill="#087a4b">valid：管理员点击保存，生成 groupsVersion 和发布快照</text>
    <text x="850" y="489" text-anchor="middle" font-size="9.5" fill="#087a4b">P0：S-01～S-08、S-10　•　S-09 AI 组建议：P1（第 5 期）</text>
    <line x1="560" y1="478" x2="597" y2="478" stroke="#087a4b" stroke-width="1.3" marker-end="url(#arrowGray)"/>
  </g>
</svg>
